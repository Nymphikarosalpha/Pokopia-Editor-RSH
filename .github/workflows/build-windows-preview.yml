name: Build Windows Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rsh-development

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip PySide6-Essentials pillow pyinstaller
      - name: Validate fork source
        run: python tools/prepare_fork.py --check-only
      - name: Verify English-only RSH interface and compile syntax
        run: python -m unittest discover -s tests -p "test_rsh_*.py" -v
      - name: Build Windows executable
        run: python tools/build_fork.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokopia-Editor-RSH-Windows-Preview
          path: dist/PokopiaEditor_RSH.exe
          if-no-files-found: error
      - name: Publish RSH preview executable in Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rsh-preview
          name: Pokopia Editor RSH - Windows Preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/PokopiaEditor_RSH.exe
          body: |
            Windows preview build of Pokopia Editor RSH (Resident, Spawn, Habitat).

            This fork extends cycalo/Pokopia-Editor. Resident editing,
            habitat placement, encounter records, event items and Lichii
            detection contain preview and experimental features.
            Back up your save and close the emulator before editing.
            Legendary and special NPC spawning is not yet verified.

            Source code: see the main branch of this repository.
            Licensed under GPL-3.0 with upstream notices preserved.
