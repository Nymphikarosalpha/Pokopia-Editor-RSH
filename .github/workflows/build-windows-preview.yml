name: Publish RSH Editor Release

# Releases are intentional editor milestones, never documentation or CI commits.
# Open Actions > Publish RSH Editor Release > Run workflow and supply the version
# and a change list describing real editor features/fixes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New editor version (e.g. v0.2.0)'
        required: true
        type: string
      editor_changes:
        description: 'English Markdown bullet list of editor changes ONLY (e.g. - Fixed habitat selection)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rsh-editor-release
  cancel-in-progress: false

jobs:
  editor-release:
    name: Validate, build and publish an actual editor version
    runs-on: windows-latest
    steps:
      - name: Check out full history including version tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and real editor changes; prepare curated notes
        env:
          RSH_VERSION: ${{ inputs.version }}
          RSH_EDITOR_CHANGES: ${{ inputs.editor_changes }}
        run: python tools/rsh_editor_release_policy.py
      - name: Reject a version that already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RSH_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$RSH_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RSH_VERSION already exists. Published versions must not be overwritten."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RSH_VERSION" >/dev/null; then
            echo "::error::Tag $RSH_VERSION already exists. Choose a new version number."
            exit 1
          fi
      - name: Install build dependencies
        run: python -m pip install --upgrade pip PySide6-Essentials pillow pyinstaller
      - name: Validate fork source
        run: python tools/prepare_fork.py --check-only
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_rsh_*.py" -v
      - name: Build Windows editor
        run: python tools/build_fork.py
      - name: Save EXE as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSH-${{ inputs.version }}-Windows
          path: dist/PokopiaEditor_RSH.exe
          if-no-files-found: error
      - name: Publish new editor version with its own changelog and EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pokopia Editor RSH ${{ inputs.version }}
          prerelease: true
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: dist/rsh-editor-release-notes.md
          files: dist/PokopiaEditor_RSH.exe
